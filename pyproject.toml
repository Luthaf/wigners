[project]
name = "wigners"
requires-python = ">=3.10"
dynamic = ["version"]

license = "Apache-2.0 OR MIT"
authors = [
    {name = "Guillaume Fraux", email = "guillaume.fraux@epfl.ch"},
]

readme = "README.md"
description = "Compute Wigner 3j and Clebsch-Gordan coefficients"

keywords = ["clebsch-gordan", "wigner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = ["numpy"]

[project.urls]
homepage = "https://github.com/Luthaf/wigners"
repository = "https://github.com/Luthaf/wigners"

### ======================================================================== ###

[build-system]
requires = [
    "setuptools >=77",
    "packaging",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
wigners = ["_wigners.so"]

### ======================================================================== ###

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["*.py"]

[tool.tox]
environments = []

[tool.tox.env_run_base]
package = "wheel"
deps = ["pytest", "sympy"]
commands = [["pytest"]]
